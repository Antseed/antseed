# Reference compose for an Antseed TEE seller on a dstack (Phala) confidential VM.
#
# dstack measures this whole file into RTMR3 as the app compose hash, and buyers accept only
# approved compose hashes (packages/antseed-verifier/src/approved-node-measurements.ts). So:
#   - `image` is an official release, pinned by digest (from the "Publish TEE seller image" run);
#   - the seller config and every setting that decides where prompts go (upstream URLs, headers,
#     body injection) are written here literally;
#   - only secrets come in as encrypted environment variables (`${...}` below), and the app's
#     allowed environment variables are exactly those.
# Replace each <...>. See deploy/tee-seller/README.md.
services:
  seller:
    image: ghcr.io/antseed/tee-seller@sha256:<release digest>
    restart: always
    # The announced address is the container port, so the public port must be the same.
    ports:
      - "6882:6882"
      - "6881:6881/udp"
    environment:
      ANTSEED_TEE_PEER_ID: "<seller peer id, 40 hex, no 0x>"
      ANTSEED_IDENTITY_HEX: ${ANTSEED_IDENTITY_HEX}
      ANTSEED_VERIFIER_SIGNING_KEY: ${ANTSEED_IDENTITY_HEX}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - seller-data:/var/lib/antseed
    configs:
      - source: seller-config
        target: /etc/antseed/config.json

configs:
  seller-config:
    content: |
      {
        "identity": { "displayName": "<seller name>" },
        "payments": { "preferredMethod": "crypto", "crypto": { "chainId": "base-mainnet" } },
        "seller": {
          "providers": {
            "inference": {
              "plugin": "openai",
              "baseUrl": "<https://upstream.example.com>",
              "defaults": { "inputUsdPerMillion": 0.5, "outputUsdPerMillion": 2 },
              "services": {
                "<service-id>": { "upstreamModel": "<upstream-model-id>", "categories": ["chat"] }
              }
            }
          }
        }
      }

volumes:
  seller-data:
