name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A merge queue on main runs the whole suite on what will land, as a push does: only pull_request
  # runs are narrowed to what the diff can reach.
  merge_group:

# A newer push to a pull request replaces the run for the older push. Runs on main are never
# cancelled: each has its own group.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Steps that several jobs share are written once, where they first appear (`&name`), and reused
# with `*name`. Every job runs on its own runner, so jobs wait for nothing but their own steps:
# the slowest job sets the time a run takes. Keep slow suites in separate jobs, not in one.
jobs:
  test:
    name: Test (packages)
    runs-on: ubuntu-latest

    steps:
      - &checkout
        uses: actions/checkout@v4

      - &setup-pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      # The Node version .nvmrc pins, for the cache below (setup-node reads the same file).
      - &node-version
        id: nv
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      # One cache entry restores everything a job installs: node_modules as a read-only squashfs
      # image (mounted below, not extracted), the Node build .nvmrc pins (the runner image has
      # another 24.x, so setup-node would download it) and Foundry. Only Typecheck saves it, after
      # a fresh install. The key covers every input of the install that the lockfile does not:
      # package.json fields such as bin, scripts and onlyBuiltDependencies, .npmrc, the patches
      # and the node postinstall script; and the Node, pnpm and Foundry versions.
      - &restore-deps
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: &deps-paths |
            ~/node_modules.sqfs
            ${{ runner.tool_cache }}/node/${{ steps.nv.outputs.version }}
            ~/.foundry/bin
          key: deps-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.nv.outputs.version }}-pnpm-9.15.4-foundry-1.9.0-${{ hashFiles('pnpm-lock.yaml', '.npmrc', '**/package.json', '!**/node_modules/**', 'patches/**', 'packages/node/scripts/patch-ethers.js') }}

      # On a hit this finds the restored Node in the tool cache instead of downloading it.
      - &setup-node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - &mount-node-modules
        name: Mount node_modules
        if: steps.deps.outputs.cache-hit == 'true'
        run: scripts/ci/node-modules-image.sh mount ~/node_modules.sqfs

      - &install
        name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # Every package the test jobs import, in one pnpm run: it orders them by their declared
      # workspace dependencies (each package declares every @antseed/* package it imports), so a
      # package starts as soon as its own dependencies are built, not when a whole tier is. Only
      # the server (tsc) part of payments and ants: no test here serves their web pages or the
      # gateway console, and the three vite builds take ~25s. Typecheck builds them in full.
      - &build-packages
        name: Build the packages
        run: pnpm run build:packages

      # Every workspace package except the three with their own job below: node, the CLI and e2e.
      # A new package is tested here without any change to this file. Everything is built above,
      # so the packages need not wait for each other (--no-sort): no test here writes another
      # package's dist/.
      - name: Test
        run: pnpm -r --no-sort --filter '!@antseed/e2e' --filter '!@antseed/cli' --filter '!@antseed/node' run test

      - name: Test (TEE seller image launcher)
        run: node --test deploy/tee-seller/*.test.mjs

  # The node package's suite is the longest of the packages; on its own runner the others don't
  # wait for it.
  test-node:
    name: Test (node)
    runs-on: ubuntu-latest

    steps:
      # Everything except desktop's bundled Whisper model and the website's static assets (140 of
      # the checkout's 184 MB), which only Test (packages), Typecheck and the installer lint read.
      # Blobless, so only the files checked out are downloaded. A test that needed an excluded
      # file would fail on its absence, not pass.
      - &checkout-sparse
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/apps/desktop/resources/
            !/apps/website/static/
      - *setup-pnpm
      - *node-version
      - *restore-deps
      - *setup-node
      - *mount-node-modules
      - *install
      # Only node and the packages it depends on: its tests import nothing else (a test that did
      # would fail on the missing build, not pass).
      - name: Build node and its dependencies
        run: pnpm --filter '@antseed/node...' run build

      - name: Test
        run: pnpm --filter '@antseed/node' run test

  # The CLI's test files are split over two runners by node's own --test-shard: every file runs in
  # exactly one shard. It is set through NODE_OPTIONS because the test script lists the files and
  # an option after them is ignored. Plain node processes (the CLI the tests start) ignore it.
  test-cli:
    name: Test (CLI, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - *checkout-sparse
      - *setup-pnpm
      - *node-version
      - *restore-deps
      - *setup-node
      - *mount-node-modules
      - *install
      - *build-packages

      # The CLI test script builds the CLI itself.
      - name: Test
        run: pnpm --filter '@antseed/cli' run test
        env:
          NODE_OPTIONS: --test-shard=${{ matrix.shard }}/2

  test-e2e:
    name: Test (e2e)
    runs-on: ubuntu-latest

    steps:
      - *checkout-sparse
      - *setup-pnpm
      - *node-version
      - *restore-deps
      - *setup-node
      - *mount-node-modules
      - *install
      - *build-packages

      - &build-cli
        name: Build the CLI
        run: pnpm --filter=@antseed/cli run build

      # e2e/global-setup.ts would build @antseed/node and the CLI again; both are built above.
      # Nothing else may write those dist/ directories while the tests run: a rebuild under a
      # running test fails it with "does not provide an export named …".
      - name: Test
        run: pnpm --filter '@antseed/e2e' run test
        env:
          ANTSEED_E2E_SKIP_BUILD: '1'

  e2e-payment:
    name: E2E Payment Flow
    runs-on: ubuntu-latest

    steps:
      - *checkout-sparse
      - *setup-pnpm
      - *node-version
      - *restore-deps
      - *setup-node
      - *mount-node-modules
      - *install

      # Foundry v1.9.0, checked against its release digest; restored with the dependencies above,
      # downloaded only on a miss. Downloaded through the API: the installer and github.com
      # release downloads for Foundry can time out (504) for hours.
      - &install-foundry
        name: Install Foundry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.deps.outputs.cache-hit }}" != "true" ]; then
            curl -fsSL --retry 5 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              -o "$RUNNER_TEMP/foundry.tgz" https://api.github.com/repos/foundry-rs/foundry/releases/assets/703110190
            echo "8d17599b42e3139f1a9c171be3798c4ed8e743ae17b84cc3435e57bf2a51ae99  $RUNNER_TEMP/foundry.tgz" | sha256sum -c -
            mkdir -p "$HOME/.foundry/bin" && tar xzf "$RUNNER_TEMP/foundry.tgz" -C "$HOME/.foundry/bin"
          fi
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"

      - name: Build tier 0 (node)
        run: pnpm run build:tier0

      # forge-std at the commit the repository pins (the submodule; foundry.lock names the same
      # commit). `forge install foundry-rs/forge-std` ignored the pin and took the latest tag.
      - &forge-deps
        name: Check out forge-std
        run: git submodule update --init --depth 1 packages/contracts/lib/forge-std

      # Shared by every job that deploys: contracts compile once per change to them.
      - &contracts-cache
        name: Restore compiled contracts
        uses: actions/cache@v4
        with:
          path: |
            packages/contracts/out
            packages/contracts/cache_forge
          key: contracts-deploy-${{ hashFiles('packages/contracts/**/*.sol', 'packages/contracts/foundry.toml', 'packages/contracts/foundry.lock', 'pnpm-lock.yaml') }}
          # On a miss (a contract or the lockfile changed), start from the newest compiled set:
          # forge's cache_forge records each source's hash, so only what changed is compiled again.
          restore-keys: contracts-deploy-

      # The deploy script compiles what it needs (without the contract tests).
      - name: Start Anvil
        run: anvil &

      - name: Run E2E payment flow
        run: node e2e/scripts/full-payment-flow.mjs
        timeout-minutes: 15

  # One runner per scenario (nine today): two scenarios on one runner slow each other down. Every
  # scenario runs in exactly one shard (see --shard in e2e/stress/ci.mjs). `shards` is the number
  # of entries in `shard`: to add a shard, add a number to the list and raise `shards` to match,
  # or some scenarios run in no shard and every job still passes. Keep the strategy context out
  # of the job name: with it there, GitHub creates one of the matrix jobs and ends the run with
  # "Internal server error".
  payment-stress:
    name: Payment stress (Base-like RPC, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8, 9]
        shards: [9]

    steps:
      - *checkout-sparse
      - *setup-pnpm
      - *node-version
      - *restore-deps
      - *setup-node
      - *mount-node-modules
      - *install
      - *install-foundry

      # The real CLI seller and buyer run here, so build up to the CLI.
      - *build-packages
      - *build-cli

      - *forge-deps
      - *contracts-cache

      - name: Run payment stress scenarios
        run: node e2e/stress/ci.mjs --parallel 2 --shard "${{ matrix.shard }}/${{ matrix.shards }}" --out "$RUNNER_TEMP/antseed-stress"
        timeout-minutes: 30

      - name: Upload stress logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: payment-stress-logs-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/antseed-stress/logs
            ${{ runner.temp }}/antseed-stress/runs/*/*.log
            ${{ runner.temp }}/antseed-stress/runs/*/*.json
          retention-days: 7

  # The scenarios are split over four runners, balanced by their time with compiled contracts
  # restored (about a minute each); the unit tests of the testbench run in the shard with the
  # shortest scenarios. Every scenario is listed in exactly one shard.
  testbench:
    name: Testbench (local chain, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            scenarios: chat-basic routing-smoke
            unit-tests: true
          - shard: 2
            scenarios: issue-1200-spendingauth-catchup
          - shard: 3
            scenarios: payment-flow
          - shard: 4
            scenarios: stress-smoke

    steps:
      - *checkout-sparse
      - *setup-pnpm
      - *node-version
      - *restore-deps
      - *setup-node
      - *mount-node-modules
      - *install
      - *install-foundry
      - *build-packages
      - *build-cli
      - *forge-deps
      - *contracts-cache

      - name: Test the testbench
        if: matrix.unit-tests
        run: pnpm test:testbench

      - name: Test the PR guard and the release scripts
        if: matrix.unit-tests
        run: pnpm test:scripts

      # One seed per commit, so a failure replays with the rerun line it prints. Set here because
      # the runner context is not available in a job-level env.
      - name: Choose the seed and state directory
        run: |
          echo "SEED=$((16#${GITHUB_SHA:0:8}))" >> "$GITHUB_ENV"
          echo "ANTSEED_TESTBENCH_HOME=$RUNNER_TEMP/testbench" >> "$GITHUB_ENV"

      # One after another, stopping at the first failure, as separate steps did.
      - name: Run ${{ matrix.scenarios }}
        run: |
          for scenario in ${{ matrix.scenarios }}; do
            echo "::group::$scenario"
            pnpm testbench run "$scenario" --chain local --strict --seed "$SEED"
            echo "::endgroup::"
          done

      - name: Upload testbench reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testbench-reports-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/testbench/*/reports
            ${{ runner.temp }}/testbench/*/logs
          retention-days: 7

      # desktop-chat is not in this job yet. It would need, after the build above:
      #   - Electron's system libraries and xvfb (apt-get)
      #   - pnpm --filter @antseed/desktop run build:main && pnpm --filter @antseed/desktop run build:renderer
      #   - pnpm exec playwright install ffmpeg
      #   - xvfb-run -a pnpm testbench run desktop-chat --chain local --strict --seed "$SEED"

  installer-lint:
    name: Lint installer script
    runs-on: ubuntu-latest

    steps:
      - *checkout

      - name: shellcheck install-gateway.sh
        run: |
          bash -n apps/website/static/install-gateway.sh
          shellcheck apps/website/static/install-gateway.sh

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-pnpm
      - *node-version
      - *restore-deps
      - *setup-node
      - *mount-node-modules
      - *install

      # Foundry goes into the same cache entry as node_modules, so the jobs that deploy restore
      # it with everything else.
      - *install-foundry

      # The one job that saves the dependencies: right after a fresh install, before anything
      # builds or writes into node_modules. Typecheck is the shortest job, so the ~30s of packing
      # the image and uploading it delays no result. A miss happens only when the key's inputs
      # change (a lockfile change, a package.json edit, a Node or pnpm bump).
      - name: Pack node_modules into an image
        if: steps.deps.outputs.cache-hit != 'true'
        run: scripts/ci/node-modules-image.sh save ~/node_modules.sqfs

      - name: Save the dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: *deps-paths
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - *build-packages
      # The only job that builds the web pages of payments and ants and the gateway console, so
      # a change that breaks a vite build still fails CI.
      - name: Build the web pages (payments, ants, gateway console)
        run: pnpm --filter=@antseed/payments --filter=@antseed/ants run build:web && pnpm --filter=@antseed/gateway-console run build

      - name: Typecheck
        run: pnpm run typecheck

      # The CLI bundled exactly as flake.nix bundles it, then started. On a pull request the Nix
      # build runs only when its inputs change (nix-changes below), so this is the check that a
      # source change still bundles and starts. The web pages Nix copies next to the bundle must
      # exist where flake.nix's installPhase reads them.
      - name: Bundle and start the CLI as Nix does
        run: |
          node_modules/.bin/esbuild apps/cli/src/cli/index.ts \
            --bundle --platform=node --format=esm --log-level=warning \
            --outfile=apps/cli/dist/bundle.mjs \
            --external:better-sqlite3 --external:node-datachannel \
            --external:koffi --external:keytar \
            '--banner:js=import { createRequire as __antseedCreateRequire } from "node:module"; var require = __antseedCreateRequire(import.meta.url);'
          node apps/cli/dist/bundle.mjs --version
          node apps/cli/dist/bundle.mjs --help > /dev/null
          test -d apps/payments/dist/web
          test -d apps/ants/dist/ants-web
          test -d apps/gateway-console/dist

  # Whether a pull request changes an input of the Nix build. The build takes 4-5 minutes and
  # breaks on its own only through these files: the lockfile and flake (the pnpmDeps hash), the
  # install's settings and patches, the scripts the build runs, the vite configs whose output
  # installPhase copies, this workflow, and the package.json of a package the CLI is built from
  # (the closure is computed, so a new dependency of the CLI is covered without editing this).
  # Source changes are covered by the bundle check in Typecheck. Pushes to main always build.
  nix-changes:
    name: Nix inputs changed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}

    steps:
      # HEAD is the pull request's merge commit and HEAD^1 is main: the diff is the files the pull
      # request would change as it lands.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - *setup-pnpm

      - id: diff
        run: |
          closure=$(pnpm --filter '@antseed/cli...' list --depth -1 --json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const p of JSON.parse(s))console.log(require("path").relative(process.cwd(),p.path)+"/package.json")})')
          echo "$closure"
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          cat "$RUNNER_TEMP/changed"
          if grep -qxF -f <(echo "$closure") "$RUNNER_TEMP/changed" \
            || grep -qE '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.npmrc|flake\.(nix|lock)|patches/|packages/node/scripts/patch-ethers\.js|scripts/(remove-paths|fix-executable)\.mjs|\.github/workflows/ci\.yml|apps/(payments|ants|gateway-console)/vite\.config\.)' "$RUNNER_TEMP/changed"; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi

  nix-build:
    name: Nix build (antseed CLI)
    runs-on: ubuntu-latest
    needs: nix-changes
    # On a push nix-changes is skipped and its output empty, so this runs. It also runs when
    # nix-changes fails: only an explicit "false" skips it.
    if: ${{ !cancelled() && needs.nix-changes.outputs.run != 'false' }}

    steps:
      - *checkout

      # Pinned SHA — DeterminateSystems/nix-installer-action @main as of 2026-08-31
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41

      # First build fetches each dependency tarball individually; keep the
      # store between runs so lockfile churn only fetches what changed.
      # Pinned SHA — DeterminateSystems/magic-nix-cache-action @main as of 2026-08-31
      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98
        with:
          # FlakeHub is not set up for this repository; left on, every run logs an error for it.
          use-flakehub: false

      # Fails when the pnpmDeps fixed-output hash in flake.nix is stale —
      # after touching pnpm-lock.yaml, regenerate with
      # ./scripts/update-nix-hash.sh (see NIX-PNPM-HASH in flake.nix).
      - name: Build antseed CLI
        run: nix build .#

      - name: Smoke test
        run: |
          ./result/bin/antseed --version
          ./result/bin/antseed --help > /dev/null
