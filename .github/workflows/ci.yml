name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Build in dependency order so each tier's tests can resolve imports
      - name: Build tier 0 (node)
        run: pnpm run build:tier0

      - name: Build tier 1 (provider-core, router-core)
        run: pnpm run build:tier1

      - name: Build tier 2 (plugins)
        run: pnpm run build:tier2

      - name: Build tier 3 (payments, ants, gateway console)
        run: pnpm run build:tier3

      # CLI test script builds itself; desktop has no tests — skip tier4.
      # e2e runs after everything else: it builds packages/node and apps/cli
      # (e2e/global-setup.ts), and a rebuild while the CLI tests import those
      # dist/ files fails them with "does not provide an export named …".
      - name: Test
        run: pnpm -r --filter '!@antseed/e2e' run test

      - name: Test (TEE seller image launcher)
        run: node --test deploy/tee-seller/*.test.mjs

      - name: Test (e2e)
        run: pnpm --filter '@antseed/e2e' run test

  e2e-payment:
    name: E2E Payment Flow
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: pnpm install

      - name: Build tier 0 (node)
        run: pnpm run build:tier0

      - name: Install Forge dependencies
        run: cd packages/contracts && forge install foundry-rs/forge-std

      # Shared with the other job that deploys: contracts compile once per change to them.
      - name: Restore compiled contracts
        uses: actions/cache@v4
        with:
          path: |
            packages/contracts/out
            packages/contracts/cache_forge
          key: contracts-deploy-${{ hashFiles('packages/contracts/**/*.sol', 'packages/contracts/foundry.toml', 'packages/contracts/foundry.lock', 'pnpm-lock.yaml') }}

      # The deploy script compiles what it needs (without the contract tests).
      - name: Start Anvil
        run: anvil &

      - name: Run E2E payment flow
        run: node e2e/scripts/full-payment-flow.mjs
        timeout-minutes: 15

  payment-stress:
    name: Payment stress (Base-like RPC)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: pnpm install

      # The real CLI seller and buyer run here, so build up to the CLI.
      - name: Build tiers 0-3 and the CLI
        run: |
          pnpm run build:tier0
          pnpm run build:tier1
          pnpm run build:tier2
          pnpm run build:tier3
          pnpm --filter=@antseed/cli run build

      - name: Install Forge dependencies
        run: cd packages/contracts && forge install foundry-rs/forge-std

      # Shared with the other job that deploys: contracts compile once per change to them.
      - name: Restore compiled contracts
        uses: actions/cache@v4
        with:
          path: |
            packages/contracts/out
            packages/contracts/cache_forge
          key: contracts-deploy-${{ hashFiles('packages/contracts/**/*.sol', 'packages/contracts/foundry.toml', 'packages/contracts/foundry.lock', 'pnpm-lock.yaml') }}

      - name: Run payment stress scenarios
        run: node e2e/stress/ci.mjs --parallel 2 --out "$RUNNER_TEMP/antseed-stress"
        timeout-minutes: 30

      - name: Upload stress logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: payment-stress-logs
          path: |
            ${{ runner.temp }}/antseed-stress/logs
            ${{ runner.temp }}/antseed-stress/runs/*/*.log
            ${{ runner.temp }}/antseed-stress/runs/*/*.json
          retention-days: 7

  testbench:
    name: Testbench (local chain)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: pnpm install

      - name: Build tiers 0-3 and the CLI
        run: |
          pnpm run build:tier0
          pnpm run build:tier1
          pnpm run build:tier2
          pnpm run build:tier3
          pnpm --filter=@antseed/cli run build

      # Same command as the other jobs that deploy. It ignores the pin: forge-std moves to the latest
      # tag and foundry.lock is rewritten, in this checkout only. Locally, restore both afterwards.
      - name: Install Forge dependencies
        run: cd packages/contracts && forge install foundry-rs/forge-std

      # Shared with the other jobs that deploy: contracts compile once per change to them.
      - name: Restore compiled contracts
        uses: actions/cache@v4
        with:
          path: |
            packages/contracts/out
            packages/contracts/cache_forge
          key: contracts-deploy-${{ hashFiles('packages/contracts/**/*.sol', 'packages/contracts/foundry.toml', 'packages/contracts/foundry.lock', 'pnpm-lock.yaml') }}

      - name: Test the testbench
        run: pnpm test:testbench

      # One seed per commit, so a failure replays with the rerun line it prints. Set here because
      # the runner context is not available in a job-level env.
      - name: Choose the seed and state directory
        run: |
          echo "SEED=$((16#${GITHUB_SHA:0:8}))" >> "$GITHUB_ENV"
          echo "ANTSEED_TESTBENCH_HOME=$RUNNER_TEMP/testbench" >> "$GITHUB_ENV"

      - name: Run chat-basic
        run: pnpm testbench run chat-basic --chain local --strict --seed "$SEED"

      - name: Run payment-flow
        run: pnpm testbench run payment-flow --chain local --strict --seed "$SEED"

      - name: Run routing-smoke
        run: pnpm testbench run routing-smoke --chain local --strict --seed "$SEED"

      - name: Run issue-1200-spendingauth-catchup
        run: pnpm testbench run issue-1200-spendingauth-catchup --chain local --strict --seed "$SEED"

      - name: Run stress-smoke
        run: pnpm testbench run stress-smoke --chain local --strict --seed "$SEED"

      - name: Upload testbench reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testbench-reports
          path: |
            ${{ runner.temp }}/testbench/*/reports
            ${{ runner.temp }}/testbench/*/logs
          retention-days: 7

      # desktop-chat is not in this job yet. It would need, after the build above:
      #   - Electron's system libraries and xvfb (apt-get)
      #   - pnpm --filter @antseed/desktop run build:main && pnpm --filter @antseed/desktop run build:renderer
      #   - pnpm exec playwright install ffmpeg
      #   - xvfb-run -a pnpm testbench run desktop-chat --chain local --strict --seed "$SEED"

  installer-lint:
    name: Lint installer script
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: shellcheck install-gateway.sh
        run: |
          bash -n apps/website/static/install-gateway.sh
          shellcheck apps/website/static/install-gateway.sh

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build tier 0 (node)
        run: pnpm run build:tier0

      - name: Build tier 1 (provider-core, router-core)
        run: pnpm run build:tier1

      - name: Build tier 2 (plugins)
        run: pnpm run build:tier2

      - name: Build tier 3 (payments, ants, gateway console)
        run: pnpm run build:tier3

      - name: Typecheck
        run: pnpm run typecheck

  nix-build:
    name: Nix build (antseed CLI)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Pinned SHA — DeterminateSystems/nix-installer-action @main as of 2026-08-31
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41

      # First build fetches each dependency tarball individually; keep the
      # store between runs so lockfile churn only fetches what changed.
      # Pinned SHA — DeterminateSystems/magic-nix-cache-action @main as of 2026-08-31
      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98

      # Fails when the pnpmDeps fixed-output hash in flake.nix is stale —
      # after touching pnpm-lock.yaml, regenerate with
      # ./scripts/update-nix-hash.sh (see NIX-PNPM-HASH in flake.nix).
      - name: Build antseed CLI
        run: nix build .#

      - name: Smoke test
        run: |
          ./result/bin/antseed --version
          ./result/bin/antseed --help > /dev/null
