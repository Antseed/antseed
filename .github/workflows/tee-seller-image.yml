name: Publish TEE seller image

# Builds deploy/tee-seller/Dockerfile from an npm-published @antseed/cli version and pushes it to
# ghcr.io/antseed/tee-seller:<version>, with a signed build provenance attestation tying the
# digest to this repository, commit and workflow. Run it after "Publish npm packages" released
# the CLI; the summary prints the digest to pin in a TEE seller's compose file.

on:
  workflow_dispatch:
    inputs:
      version:
        description: '@antseed/cli version to package (default: apps/cli/package.json on the selected ref)'
        type: string
        required: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/antseed/tee-seller

jobs:
  image:
    name: Build, push & attest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Resolve CLI version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$(node -p "require('./apps/cli/package.json').version")}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$version'"; exit 1
          fi
          if [ "$(npm view "@antseed/cli@$version" version 2>/dev/null)" != "$version" ]; then
            echo "::error::@antseed/cli@$version is not on npm yet; publish it first"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Fixed timestamps, so a rebuild of the same commit and version yields the same layers.
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: deploy/tee-seller
          platforms: linux/amd64
          build-args: ANTSEED_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true
          outputs: type=image,push=true,rewrite-timestamp=true

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### TEE seller image $VERSION"
            echo
            echo "Pin it in the compose file:"
            echo
            echo '```yaml'
            echo "image: $IMAGE@$DIGEST"
            echo '```'
            echo
            echo "Verify: \`gh attestation verify oci://$IMAGE@$DIGEST --repo $GITHUB_REPOSITORY\`"
          } >> "$GITHUB_STEP_SUMMARY"
