name: Publish npm packages

# Builds the workspace and publishes every public package whose version is
# not yet on the npm registry (pnpm -r publish skips already-published
# versions), so the flow is: bump versions on main, then run this workflow.
#
# Requirements:
#   - NPM_TOKEN repo secret: npm automation token with publish rights to the
#     @antseed scope.
#   - ANTSEED_COMPARABLE_PRICES_URL repo variable: retail-prices models API
#     baked into release builds as the savings baseline (see
#     scripts/bake-comparable-prices-url.mjs).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, test, and pack — but do not publish to npm'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Build, test & publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      # What to publish is decided by version bumps (the /publish flow bumps
      # and commits them; pnpm -r publish skips versions already on npm).
      # This step prints the resulting plan and fails on release invariants:
      # exact-pin dependents missing a bump, or local versions behind npm.
      - name: Publish plan
        run: node scripts/npm-publish-plan.mjs

      - name: Bake comparable-prices URL
        env:
          ANTSEED_COMPARABLE_PRICES_URL: ${{ vars.ANTSEED_COMPARABLE_PRICES_URL }}
        run: node scripts/bake-comparable-prices-url.mjs --require

      # Build in dependency order; tier4 desktop and the standalone web apps
      # are not published to npm, so only the CLI is built from tier4.
      - name: Build publishable packages
        run: |
          pnpm run build:tier0
          pnpm run build:tier1
          pnpm run build:tier2
          pnpm run build:tier3
          pnpm --filter=@antseed/cli run build
          pnpm --filter=@antseed/network-stats run build

      - name: Test
        run: pnpm -r run test

      # --no-git-checks: the bake step dirties the working tree on purpose.
      # Private packages (e.g. @antseed/ui) are skipped automatically.
      - name: Publish changed packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >
          pnpm --filter './packages/*' --filter './plugins/*'
          --filter @antseed/cli --filter @antseed/network-stats
          --filter @antseed/payments --filter @antseed/ants --filter @antseed/relay
          publish --access public --no-git-checks
          ${{ inputs.dry_run && '--dry-run' || '' }}
