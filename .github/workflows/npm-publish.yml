name: Publish npm packages

# Builds the workspace and publishes every public package whose version is
# not yet on the npm registry (pnpm -r publish skips already-published
# versions), so the flow is: bump versions on main, then run this workflow.
#
# Requirements:
#   - NPM_TOKEN repo secret: npm automation token with publish rights to the
#     @antseed scope.
#   - ANTSEED_COMPARABLE_PRICES_URL repo variable: retail-prices models API
#     baked into release builds as the savings baseline (see
#     scripts/bake-comparable-prices-url.mjs).
#   - POSTHOG_HOST and POSTHOG_PROJECT_API_KEY repo variables: the public
#     PostHog project the CLI, buyer and gateway send telemetry to
#     (scripts/bake-desktop-telemetry-config.mjs, docs/telemetry.md).
#
# Once the CLI version on this commit is on npm, the run also creates a
# GitHub release tagged cli-v<version> (scripts/github-release-notes.mjs). It is never marked
# Latest: the desktop app's auto-updater and download links read the latest
# release, which must stay the desktop's.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, test, and pack — but do not publish to npm'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Build, test & publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # npm-publish-plan.mjs reads the history to find unbumped dependencies.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      # What to publish is decided by version bumps (the /publish flow bumps
      # and commits them; pnpm -r publish skips versions already on npm).
      # This step prints the resulting plan and fails on release invariants:
      # exact-pin dependents missing a bump, or local versions behind npm.
      - name: Publish plan
        run: node scripts/npm-publish-plan.mjs

      - name: Bake comparable-prices URL
        env:
          ANTSEED_COMPARABLE_PRICES_URL: ${{ vars.ANTSEED_COMPARABLE_PRICES_URL }}
        run: node scripts/bake-comparable-prices-url.mjs --require

      - name: Bake telemetry config
        env:
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          POSTHOG_PROJECT_API_KEY: ${{ vars.POSTHOG_PROJECT_API_KEY }}
        run: node scripts/bake-desktop-telemetry-config.mjs --require

      # Build in dependency order; tier4 desktop and the standalone web apps
      # are not published to npm, so only the CLI is built from tier4.
      - name: Build publishable packages
        run: |
          pnpm run build:tier0
          pnpm run build:tier1
          pnpm run build:tier2
          pnpm run build:tier3
          pnpm --filter=@antseed/cli run build
          pnpm --filter=@antseed/network-stats run build

      # e2e runs after everything else, as in ci.yml: it builds packages/node and
      # apps/cli (e2e/global-setup.ts), and a rebuild while the CLI tests import
      # those dist/ files fails them with "does not provide an export named …".
      - name: Test
        run: pnpm -r --filter '!@antseed/e2e' run test

      - name: Test (e2e)
        run: pnpm --filter '@antseed/e2e' run test

      # --no-git-checks: the bake step dirties the working tree on purpose.
      # Private packages (e.g. @antseed/ui) are skipped automatically.
      - name: Publish changed packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >
          pnpm --filter './packages/*' --filter './plugins/*'
          --filter @antseed/cli --filter @antseed/network-stats
          --filter @antseed/payments --filter @antseed/ants --filter @antseed/gateway-console
          --filter @antseed/relay
          publish --access public --no-git-checks
          ${{ inputs.dry_run && '--dry-run' || '' }}

  # Its own job, so only this one holds a token that can write to the repo
  # (dependency installs and tests in the publish job never see it).
  github-release:
    name: GitHub release
    needs: publish
    # Also after a failed publish: the CLI may be on npm already, and the
    # script checks npm, so a run that published nothing makes no release.
    if: ${{ !inputs.dry_run && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Pinned to commits: this job can write to the repository.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # github-release-notes.mjs lists the PRs since the previous CLI bump.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node scripts/github-release-notes.mjs "$RUNNER_TEMP/release-notes.md")
          if [ -z "$version" ]; then
            echo "This CLI version is not on npm; no GitHub release."
            exit 0
          fi
          if gh release view "cli-v${version}" >/dev/null 2>&1; then
            echo "Release cli-v${version} already exists."
            exit 0
          fi
          gh release create "cli-v${version}" --target "$GITHUB_SHA" --title "CLI ${version}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --latest=false
