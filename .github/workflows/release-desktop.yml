name: Release Desktop

# Builds and publishes the AntSeed Desktop Electron app for macOS,
# Windows, and Linux in parallel, attaching artifacts to the same GitHub
# Release (tagged v<version>, read from apps/desktop/package.json).
#
# macOS: DMG + zip, arm64 + x64, code-signed with Developer ID and
#        notarized via Apple App Store Connect API key.
# Windows: NSIS installer, x64 + arm64. Optional code signing via the
#          CA's cloud signing API if the WIN_SIGN_* secrets are set
#          (see apps/desktop/scripts/win-sign.cjs).
# Linux: AppImage + deb, x64 + arm64, unsigned. Each arch builds on a
#        native runner (ubuntu-latest / ubuntu-24.04-arm) so native
#        modules never need cross-compilation.
#
# Triggers:
#   - Manual dispatch from the Actions tab (or `gh workflow run`). Choose
#     which platforms to build via the `platforms` input.
#   - Push of a `desktop-v*` tag builds all platforms.
#
# Required repo secrets:
#   macOS:
#     MAC_CSC_LINK              base64 of a .p12 containing the Developer
#                               ID Application cert + private key
#                               (export from Keychain Access, then
#                               `base64 -i cert.p12 | pbcopy`)
#     MAC_CSC_KEY_PASSWORD      password for the .p12
#     APPLE_API_KEY_P8          contents of AuthKey_XXXXXXXXXX.p8 (paste
#                               the file contents directly into the secret,
#                               including the BEGIN/END lines)
#     APPLE_API_KEY_ID          e.g. 6JDM29LC2C
#     APPLE_API_ISSUER          issuer UUID from App Store Connect
#     APPLE_TEAM_ID             e.g. H3M5BXXQR2
#   Windows (optional, for signed installers — the private key lives in
#   the CA's cloud HSM, there is no .pfx. Signing talks straight to the
#   CA's HTTPS API via the `ssign` CLI, authenticating with a TOTP. Both
#   secrets live in the `release-signing` protected environment, not as
#   repo secrets):
#     WIN_SIGN_EMAIL            signing service account e-mail
#     WIN_SIGN_OTP              TOTP seed (base32 or otpauth:// URI).
#                               Long-lived signing credential — rotate by
#                               re-issuing the service's QR if it leaks.
#
# Publishing auth uses the built-in GITHUB_TOKEN (contents: write).

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which platforms to build'
        type: choice
        default: all
        options:
          - all
          - mac
          - win
          - linux
      dry_run:
        description: 'Build only, do not publish to GitHub Releases'
        type: boolean
        default: false
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write  # needed for electron-builder to publish to Releases

jobs:
  # electron-builder creates the draft release when it doesn't exist yet.
  # With several platform jobs publishing in parallel, two can pass that
  # existence check at the same moment and each create their own draft,
  # splitting the assets across duplicate v<version> drafts. Pre-create
  # the draft here so every platform job finds it and only uploads assets.
  create-draft:
    name: Create draft release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Create the draft release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run — nothing will be published, skipping draft creation"
            exit 0
          fi
          version=$(node -p "require('./apps/desktop/package.json').version")
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "Release v${version} already exists"
          else
            gh release create "v${version}" --draft --title "${version}" --notes ""
          fi

  mac:
    name: Build & publish macOS
    # Tag-push always runs every platform.
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'mac'
    needs: create-draft
    runs-on: macos-14  # Apple Silicon; electron-builder cross-builds x64
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Bake comparable-prices URL
        env:
          ANTSEED_COMPARABLE_PRICES_URL: ${{ vars.ANTSEED_COMPARABLE_PRICES_URL }}
        run: node scripts/bake-comparable-prices-url.mjs --require

      - name: Bake desktop telemetry config
        env:
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          POSTHOG_PROJECT_API_KEY: ${{ vars.POSTHOG_PROJECT_API_KEY }}
        run: node scripts/bake-desktop-telemetry-config.mjs --require

      - name: Build monorepo (tiers 0-3)
        run: |
          pnpm run build:tier0
          pnpm run build:tier1
          pnpm run build:tier2
          pnpm run build:tier3

      - name: Write Apple API key to disk
        # electron-builder's notarization expects APPLE_API_KEY to be a
        # file path to the .p8. Write the secret contents to a temp file
        # outside the repo so it can't accidentally be packaged.
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/apple-api-key"
          mkdir -p "$key_dir"
          key_path="$key_dir/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Build & publish desktop (macOS)
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder accepts base64-encoded content directly in CSC_LINK.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # APPLE_API_KEY is set via GITHUB_ENV in the previous step.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run dist:mac
          else
            npm run release:mac
          fi

      - name: Upload installers as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antseed-desktop-mac
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: warn
          retention-days: 14

  win:
    name: Build & publish Windows
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'win'
    needs: create-draft
    runs-on: windows-latest
    timeout-minutes: 45
    # The signing secrets live in a protected environment restricted by a
    # deployment ref policy (main + desktop-v* tags) — the TOTP seed is a
    # long-lived signing credential and the repo is public, so arbitrary
    # branches must not be able to read it. No manual approval.
    environment: release-signing
    env:
      # Exposed at job level so steps can gate on `env.WIN_SIGN_EMAIL != ''`
      # (the secrets context can't be used directly in step `if`s reliably).
      WIN_SIGN_EMAIL: ${{ secrets.WIN_SIGN_EMAIL }}
      # ssign revision the "Build ssign" step builds (security-reviewed).
      SSIGN_REV: 326aa34137b3441812e5300f3a0dbef6bd5a2f97

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # windows-latest ships with Python + VS Build Tools, needed by
      # node-gyp to rebuild native modules against Electron's Node ABI.
      - name: Install dependencies
        run: pnpm install
        shell: pwsh

      - name: Bake comparable-prices URL
        env:
          ANTSEED_COMPARABLE_PRICES_URL: ${{ vars.ANTSEED_COMPARABLE_PRICES_URL }}
        run: node scripts/bake-comparable-prices-url.mjs --require
        shell: pwsh

      - name: Bake desktop telemetry config
        env:
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          POSTHOG_PROJECT_API_KEY: ${{ vars.POSTHOG_PROJECT_API_KEY }}
        run: node scripts/bake-desktop-telemetry-config.mjs --require
        shell: pwsh

      - name: Build monorepo (tiers 0-3)
        run: |
          pnpm run build:tier0
          pnpm run build:tier1
          pnpm run build:tier2
          pnpm run build:tier3
        shell: pwsh

      - name: Cache ssign binary
        if: env.WIN_SIGN_EMAIL != ''
        id: ssign-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/ssign.exe
          key: ssign-${{ env.SSIGN_REV }}-windows-x64

      - name: Build ssign (cloud signing CLI)
        # Built from a pinned, reviewed revision rather than a prebuilt
        # binary — this tool handles the signing credential.
        if: env.WIN_SIGN_EMAIL != '' && steps.ssign-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/Le-Syl21/ssign --rev $env:SSIGN_REV ssign
        shell: pwsh

      - name: Build & publish desktop (Windows)
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # WIN_SIGN_EMAIL comes from the job-level env; both are read by
          # apps/desktop/scripts/win-sign.cjs (the win.sign hook).
          WIN_SIGN_OTP: ${{ secrets.WIN_SIGN_OTP }}
        run: |
          if ("${{ inputs.dry_run }}" -eq "true") {
            npm run dist:win
          } else {
            npm run release:win
          }
        shell: pwsh

      - name: Verify Authenticode signatures
        if: env.WIN_SIGN_EMAIL != ''
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          $failed = $false
          Get-ChildItem apps/desktop/release/*.exe | ForEach-Object {
            & $signtool.FullName verify /pa $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { throw 'signature verification failed' }

      - name: Upload installers as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antseed-desktop-win
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: warn
          retention-days: 14

  linux:
    name: Build & publish Linux (${{ matrix.arch }})
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'linux'
    needs: create-draft
    strategy:
      fail-fast: false
      matrix:
        include:
          # One native runner per arch — prepare-dist then fetches/builds
          # native modules (better-sqlite3 etc.) for the host arch, so no
          # cross-compilation is ever needed. x64 publishes latest-linux.yml,
          # arm64 publishes latest-linux-arm64.yml, so the two jobs never
          # clobber each other's updater metadata.
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # keytar links against libsecret-1.so.0 at load time, and the runner
      # images don't ship it. The -dev package also covers a from-source
      # rebuild if the prebuild is ever unavailable.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      # electron-builder's bundled fpm (used for the deb target) is an x86
      # binary and can't run on the arm64 runner — install fpm from RubyGems
      # and point electron-builder at it via USE_SYSTEM_FPM below.
      - name: Install fpm (arm64)
        if: matrix.arch == 'arm64'
        run: sudo gem install fpm --no-document

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Bake comparable-prices URL
        env:
          ANTSEED_COMPARABLE_PRICES_URL: ${{ vars.ANTSEED_COMPARABLE_PRICES_URL }}
        run: node scripts/bake-comparable-prices-url.mjs --require

      - name: Bake desktop telemetry config
        env:
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          POSTHOG_PROJECT_API_KEY: ${{ vars.POSTHOG_PROJECT_API_KEY }}
        run: node scripts/bake-desktop-telemetry-config.mjs --require

      - name: Build monorepo (tiers 0-3)
        run: |
          pnpm run build:tier0
          pnpm run build:tier1
          pnpm run build:tier2
          pnpm run build:tier3

      - name: Build & publish desktop (Linux ${{ matrix.arch }})
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_SYSTEM_FPM: ${{ matrix.arch == 'arm64' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run dist:linux
          else
            npm run release:linux
          fi

      - name: Upload installers as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antseed-desktop-linux-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/latest*.yml
          if-no-files-found: warn
          retention-days: 14
