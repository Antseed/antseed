name: Mac app

on:
  push:
    branches: [main]
    paths: ['apps/mac-worker/**', '.github/workflows/mac-worker.yml']
  pull_request:
    branches: [main]
    paths: ['apps/mac-worker/**', '.github/workflows/mac-worker.yml']

jobs:
  swift-test:
    name: Swift tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Swift tests
        working-directory: apps/mac-worker
        run: swift test
