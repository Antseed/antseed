<!-- Providers: what Amos's two diagrams say, laid on our two paintings (merge, 17 Nov). Web pastes each block as the last child of its
     .s-path-panel (the stall's, then the colony's); styles hero/providers-v3.css. Positions are in the paintings' own pixels (1600 × 1073),
     so they hold the painting's ants and machines at every width. -->

<!-- Own provider (stall): a buyer comes straight to your stall; your listing: you choose what you serve, you set the price, buyers come direct;
     a request received, served, settled -->
<div class="pvx pvx-own">
  <svg class="pvx-links" viewBox="0 0 1600 1073" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path class="pvx-line" d="M 200 660 C 420 700, 560 800, 690 840"/></svg>
  <p class="pvx-glass pvx-chip pvx-buyer" style="--x: 56; --y: 640">Buyer</p>
  <div class="pvx-glass pvx-card" data-placeholder="copy">
    <p class="pvx-card-h"><i class="pvx-dot"></i>Your provider</p>
    <dl>
      <div><dt>Models &amp; services</dt><dd>You choose</dd></div>
      <div><dt>Price per request</dt><dd>You set</dd></div>
      <div><dt>Buyer connection</dt><dd>Direct</dd></div>
    </dl>
    <p class="pvx-flow"><span>Request received</span><i>→</i><span>serve</span><i>→</i><span>settle</span></p>
  </div>
</div>

<!-- Colony: three Macs, one provider; the machines linked, capacity shared, routing managed by an operator -->
<div class="pvx pvx-colony">
  <svg class="pvx-links" viewBox="0 0 1600 1073" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path class="pvx-line" d="M 555 790 Q 690 700 815 665"/>
    <path class="pvx-line" d="M 815 665 Q 950 720 1060 815"/>
    <path class="pvx-line" d="M 555 800 Q 800 880 1060 825"/>
  </svg>
  <div class="pvx-glass pvx-label" data-placeholder="copy">
    <p class="pvx-label-h">Many Macs. One provider.</p>
    <p class="pvx-label-s">Shared capacity · operator-managed routing</p>
  </div>
  <p class="pvx-glass pvx-chip pvx-mac" style="--x: 535; --y: 930" data-placeholder="copy">Your Mac</p>
  <p class="pvx-glass pvx-chip pvx-mac" style="--x: 835; --y: 800" data-placeholder="copy">Another Mac</p>
  <p class="pvx-glass pvx-chip pvx-mac" style="--x: 1090; --y: 950" data-placeholder="copy">One more Mac</p>
</div>
