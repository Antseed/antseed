<!-- Providers, second pass (Elio, 17 Nov). Web pastes each block as the last child of its .s-path-panel, in place of the .pvx blocks
     (providers-overlays.html), and loads hero/providers-v4.css instead of providers-v3.css.
     Own provider: the whole moving painting (stall, swinging price board, the ant and its eyes) slides left, so the stall stands on the
     left and Amos's listing reads on the right. Colony: the three Macs cabled to one another on the ground, one outline round all three
     and its name on it, so they read as one provider. Both drawn in the painting's own pixels (.pvy-art sits exactly as .pv-set does). -->

<!-- Own provider (stall) -->
<div class="pvy pvy-own">
  <div class="pvy-glass pvy-card">
    <p class="pvy-card-h"><i class="pvy-dot"></i>Your provider</p>
    <dl>
      <div><dt>Models &amp; services</dt><dd>You choose</dd></div>
      <div><dt>Price per request</dt><dd>You set</dd></div>
      <div><dt>Buyer connection</dt><dd>Direct</dd></div>
    </dl>
    <p class="pvy-flow"><span>Request received</span><i>→</i><span>serve</span><i>→</i><span>settle</span></p>
  </div>
</div>

<!-- Colony -->
<div class="pvy pvy-colony">
  <div class="pvy-art">
    <svg viewBox="0 0 1600 1073" preserveAspectRatio="none" aria-hidden="true">
      <path class="pvy-hull" d="M 430 820 C 420 700, 640 600, 820 600 C 1010 600, 1210 720, 1200 860 C 1190 980, 980 1000, 800 990 C 600 985, 440 950, 430 820 Z"/>
      <path class="pvy-cable" id="pvy-c1" d="M 560 905 C 640 860, 720 800, 835 778"/>
      <path class="pvy-cable" id="pvy-c2" d="M 840 778 C 950 800, 1030 860, 1085 925"/>
      <path class="pvy-cable" id="pvy-c3" d="M 1080 930 C 900 975, 720 965, 565 910"/>
      <circle class="pvy-pulse" r="9"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#pvy-c1"/></animateMotion></circle>
      <circle class="pvy-pulse" r="9"><animateMotion dur="2.4s" begin=".8s" repeatCount="indefinite"><mpath href="#pvy-c2"/></animateMotion></circle>
      <circle class="pvy-pulse" r="9"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite"><mpath href="#pvy-c3"/></animateMotion></circle>
    </svg>
    <p class="pvy-glass pvy-chip pvy-one" style="--x: 820; --y: 600">One provider</p>
    <p class="pvy-glass pvy-chip pvy-mac" style="--x: 520; --y: 960">Your Mac</p>
    <p class="pvy-glass pvy-chip pvy-mac" style="--x: 700; --y: 735">Another Mac</p>
    <p class="pvy-glass pvy-chip pvy-mac" style="--x: 1110; --y: 985">One more Mac</p>
  </div>
  <div class="pvy-glass pvy-label">
    <p class="pvy-label-h">Many Macs. One provider.</p>
    <p class="pvy-label-s">Shared capacity · operator-managed routing</p>
  </div>
</div>
